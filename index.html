<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>盈亏 ROI 计算器</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#fff; --text:#1f2433; --text-2:#5a6275; --text-3:#9aa2b4;
    --border:#e8ecf3; --c-green:#16a06a; --c-green-soft:#e9f8ef; --c-green-bd:#84d2a3;
    --c-red:#e54646;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:6px 12px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  h1{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:5px}
  h1::before{content:"";width:3px;height:12px;background:var(--c-red);border-radius:2px;display:inline-block}
  .btn{font-size:11px;color:#5a6275;background:#eef1f6;border:none;border-radius:20px;padding:3px 10px;cursor:pointer;font-family:inherit;font-weight:700}
  .btn:active{opacity:.7}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 8px rgba(20,30,60,.05);padding:9px 11px 11px}
  .sec{--acs:#f6f8fa;--ac:#5a6275}
  .sec+.sec{margin-top:7px}
  .sec.s1{--acs:#eaf1ff;--ac:#2876ff}
  .sec.s2{--acs:#fff5e6;--ac:#f59e0b}
  .sec.s3{--acs:#e8f8f1;--ac:#10b981}
  .b-h{font-size:11px;font-weight:800;color:var(--ac);margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .b-h .dot{width:6px;height:6px;border-radius:50%;background:var(--ac)}

  /* 竖排填写行：label 左 + input 右，紧凑行高 */
  .f-row{display:flex;align-items:center;gap:9px;background:var(--acs);border:1px solid var(--border);border-radius:8px;padding:2px 9px;margin-bottom:3px}
  .f-row:last-child{margin-bottom:0}
  .f-row label{font-size:12px;font-weight:700;color:var(--text-2);flex:0 0 auto;min-width:84px;white-space:nowrap}
  .f-row .inp{flex:1;min-width:0;max-width:190px;margin-left:auto}
  .inp{display:flex;align-items:center;gap:3px}
  .inp input{flex:1;min-width:0;width:100%;height:25px;background:var(--c-green-soft);border:1.5px solid var(--c-green-bd);border-radius:6px;
    padding:1px 8px;font-size:14px;font-weight:800;color:#0f5c2e;text-align:right;font-variant-numeric:tabular-nums;
    font-family:inherit;outline:none;-webkit-appearance:none;-moz-appearance:textfield}
  .inp input:focus{border-color:var(--ac);background:#fff}
  .inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .inp .pre{font-size:12px;font-weight:800;color:var(--c-green);margin-right:-2px}

  /* 中间量三值：结算 / 签收率 / 转化成本，一行三卡 */
  .ro3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
  .mini{background:#f6f8fa;border-radius:7px;padding:4px 6px;text-align:center}
  .mini .k{display:block;font-size:9.5px;color:var(--text-3);line-height:1.2;white-space:nowrap}
  .mini b{display:block;font-size:13px;font-weight:800;color:#0f5c2e;font-variant-numeric:tabular-nums;line-height:1.3}

  /* 结果：大利润 + 保本/利润率/距保本 同一行 */
  .res{display:flex;align-items:center;gap:10px;background:#e8f8f1;border:1px solid #b6e6d4;border-radius:10px;padding:7px 10px;margin-top:5px}
  .res .rl{font-size:10px;color:#3f7a63;font-weight:700;line-height:1.25;margin-bottom:1px}
  .res .rb{font-size:25px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
  .res .rb .u{font-size:13px;font-weight:700;margin-right:1px}
  .res .ms{margin-left:auto;text-align:right;display:grid;gap:1px}
  .res .ms div{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;font-size:10px;color:var(--text-3)}
  .res .ms b{font-size:12.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}

  .pos{color:var(--c-red)} .neg{color:var(--c-green)}
  .res .ms b.pos{color:var(--c-red)} .res .ms b.neg{color:var(--c-green)}

  @media(max-width:400px){
    .f-row label{font-size:11.5px;min-width:78px}
    .inp input{font-size:15px}
    .f-row .inp{max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>盈亏 ROI 计算器</h1>
    <button class="btn" id="reset">↺ 清空核心</button>
  </div>

  <div class="card">

    <section class="sec s1">
      <div class="b-h"><span class="dot"></span>货品与费用</div>
      <div class="f-row"><label>售价</label><div class="inp"><input type="number" id="price" value="" step="0.01" min="0"></div></div>
      <div class="f-row"><label>产品成本</label><div class="inp"><input type="number" id="costU" value="" step="0.01" min="0"></div></div>
      <div class="f-row"><label>发货运费</label><div class="inp"><input type="number" id="shipU" value="" step="0.01" min="0"></div></div>
    </section>

    <section class="sec s2">
      <div class="b-h"><span class="dot"></span>退货 · 扣点 · 佣金</div>
      <div class="f-row"><label>退货售后费</label><div class="inp"><input type="number" id="afterU" value="" step="0.01" min="0"></div></div>
      <div class="f-row"><label>售前退货率</label><div class="inp"><span class="pre">%</span><input type="number" id="preRet" value="20" step="0.1" min="0" max="100"></div></div>
      <div class="f-row"><label>售后退货率</label><div class="inp"><span class="pre">%</span><input type="number" id="postRet" value="25" step="0.1" min="0" max="100"></div></div>
      <div class="f-row"><label>平台扣点</label><div class="inp"><span class="pre">%</span><input type="number" id="deductPct" value="5" step="0.1" min="0"></div></div>
      <div class="f-row"><label>税点</label><div class="inp"><span class="pre">%</span><input type="number" id="taxPct" value="8" step="0.1" min="0"></div></div>
      <div class="f-row"><label>达人佣金</label><div class="inp"><span class="pre">%</span><input type="number" id="commissionPct" value="" step="0.1" min="0"></div></div>
    </section>

    <section class="sec s3">
      <div class="b-h"><span class="dot"></span>投流</div>
      <div class="f-row"><label>支付 ROI</label><div class="inp"><input type="number" id="roi" value="" step="0.01" min="0"></div></div>
      <div class="f-row"><label>净成交 ROI</label><div class="inp"><input type="number" id="roiNet" value="" step="0.01" min="0"></div></div>
    </section>

    <div class="ro3">
      <div class="mini"><span class="k">实际结算金额</span><b id="oSettle">—</b></div>
      <div class="mini"><span class="k">实际签收率</span><b id="oSign">—</b></div>
      <div class="mini"><span class="k">单件转化成本</span><b id="oConvU">—</b></div>
    </div>

    <div class="res">
      <div>
        <div class="rl">单件到手利润（红=赚 / 绿=亏）</div>
        <div class="rb" id="bigProfit">—</div>
      </div>
      <div class="ms">
        <div><span>保本 ROI</span><b id="mBE" style="color:var(--c-red)">—</b></div>
        <div><span>利润率</span><b id="mRate">—</b></div>
        <div><span>距保本</span><b id="mMargin">—</b></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var ids=["price","costU","shipU","afterU","preRet","postRet","deductPct","taxPct","commissionPct","roi","roiNet"];
  // 初始默认 = 清空核心后的状态：核心项（售价/成本/运费/售后费/佣金/ROI）为空，
  // 固定项：售前退货率20 / 售后退货率25 / 平台扣点5 / 税点8
  var D={price:"",costU:"",shipU:"",afterU:"",preRet:20,postRet:25,deductPct:5,taxPct:8,commissionPct:"",roi:"",roiNet:""};
  var lastEdit="roi"; // 最近编辑的ROI来源：roi=支付为主 / roiNet=净成交为主
  var QTY=1; // 销售数量固定为 1（系数）
  function num(id){var v=parseFloat($(id).value);return isFinite(v)?v:0;}
  function fmt(x,d){if(d===undefined)d=2;if(!isFinite(x))return "—";return x.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});}
  function cls(x){return x>=0?"pos":"neg";}

  // 支付ROI ↔ 净成交ROI 双向联动：净成交 = 支付 × (1−售前退货率)，以最近编辑的为准
  function syncROI(){
    var pre=num("preRet")/100;
    if(lastEdit==="roiNet"){
      if($("roiNet").value.trim()===""){ $("roi").value=""; return; }
      var rn=num("roiNet");
      var r=(1-pre)>0?rn/(1-pre):NaN;
      $("roi").value=isFinite(r)?parseFloat(r.toFixed(4)):"";
    }else{
      if($("roi").value.trim()===""){ $("roiNet").value=""; return; }
      var r=num("roi");
      var rn=(1-pre)>=0?r*(1-pre):NaN;
      $("roiNet").value=isFinite(rn)?parseFloat(rn.toFixed(4)):"";
    }
  }
  function calc(){
    syncROI();
    var price=num("price"),costU=num("costU");
    var pre=num("preRet")/100,post=num("postRet")/100;
    var shipU=num("shipU"),afterU=num("afterU");
    var deductPct=num("deductPct")/100,taxPct=num("taxPct")/100,commissionPct=num("commissionPct")/100;
    var roi=num("roi");

    var gmv=price*QTY;
    var sign=(1-pre)*(1-post);
    var settle=gmv*sign;
    var costTot=costU*QTY*sign;
    var shipTot=shipU*QTY*(1-pre);
    var afterTot=afterU*QTY*(1-pre)*post;
    var deductTot=settle*deductPct;
    var taxTot=settle*taxPct;
    var commissionTot=settle*commissionPct;
    var convU=roi>0?price/roi:NaN, adTot=isFinite(convU)?convU*QTY:NaN;
    var exp=costTot+shipTot+afterTot+deductTot+taxTot+commissionTot+(isFinite(adTot)?adTot:0);
    var profit=settle-exp, rate=settle>0?profit/settle:NaN;
    var fixed=costTot+shipTot+afterTot+deductTot+taxTot+commissionTot;
    var denom=settle-fixed;
    var be=(denom>0)?(price*QTY)/denom:NaN;
    var margin=(isFinite(be)&&be>0&&roi>0)?(roi-be)/be*100:NaN;

    $("oSign").textContent=fmt(sign*100)+"%";
    $("oSettle").textContent=fmt(settle);
    $("oConvU").textContent=fmt(convU);

    var bp=$("bigProfit");
    bp.className="rb "+cls(profit);
    bp.innerHTML='<span class="u">¥</span>'+(profit>=0?"+":"")+fmt(profit);

    var mr=$("mRate"); mr.textContent=(settle>0?fmt(rate*100,1)+"%":"—"); mr.className=cls(profit);
    var mb=$("mBE"); mb.textContent=fmt(be);
    var mm=$("mMargin"); mm.textContent=isFinite(margin)?(margin>=0?"+":"")+fmt(margin,1)+"%":"—"; mm.className=cls(margin>=0?1:-1);
  }
  ids.forEach(function(id){ if(id!=="roi"&&id!=="roiNet") $(id).addEventListener("input",calc); });
  // ROI 双框联动：以最近编辑的为准
  $("roi").addEventListener("input",function(){lastEdit="roi";calc();});
  $("roiNet").addEventListener("input",function(){lastEdit="roiNet";calc();});

  // 清空核心：回到初始态 —— 售价/产品成本清空，售前20/售后25/平台扣点5/税点8 保留，
  // 其余（运费/售后费/达人佣金/ROI）全部清空，并自动聚焦售价、全选待重填
  $("reset").addEventListener("click",function(){
    ["price","costU","shipU","afterU","commissionPct","roi","roiNet"].forEach(function(id){$(id).value="";});
    $("preRet").value="20";
    $("postRet").value="25";
    $("deductPct").value="5";
    $("taxPct").value="8";
    lastEdit="roi";
    calc();
    var first=$("price");
    first.focus();
    if(first.select) first.select();
  });

  // 回车跳到下一个输入框（按页面视觉顺序）
  var inputs=Array.prototype.slice.call(document.querySelectorAll(".inp input"));
  inputs.forEach(function(inp,i){
    // 点击输入框即全选已有数字，方便直接覆盖重填
    inp.addEventListener("click",function(){ if(this.select) this.select(); });
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.keyCode===13){
        e.preventDefault();
        var next=inputs[(i+1)%inputs.length];
        next.focus();
        if(next.select) next.select();
      }
    });
  });

  calc();
})();
</script>
</body>
</html>
